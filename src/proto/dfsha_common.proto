syntax = "proto3";

package dfsha;

// =====================================================================
//  Tipos compartidos por los tres servicios.
//
//  Semana 10: el .proto unico de la semana 6 se separo en cuatro
//  archivos, uno por par de comunicacion mas este de tipos comunes.
//  Semana 11: Entry lleva dueno y permisos (ACL por usuario y grupo).
// =====================================================================

message Empty {}

message StatusResponse {
  bool   ok      = 1;
  string message = 2;
}

// Un archivo o no existe, o existe completo. No hay estado intermedio
// visible: eso es el WORM.
enum FileState {
  UNDER_CONSTRUCTION = 0;
  COMMITTED          = 1;
}

message Entry {
  string name   = 1;
  bool   is_dir = 2;
  uint64 size   = 3;
  string owner  = 4;
  string group  = 5;
  uint32 mode   = 6;   // bits rwx estilo Unix: 0o750, 0o1777, ...
}
